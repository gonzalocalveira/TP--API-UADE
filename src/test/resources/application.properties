# Configuracion usada SOLO por los tests (mvn test / mvn package).
# Los tests corren contra una base H2 en memoria, asi el proyecto compila y
# pasa los tests aunque la maquina no tenga MySQL instalado ni levantado.
spring.datasource.url=jdbc:h2:mem:gestioncine-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
