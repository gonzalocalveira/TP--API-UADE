spring.application.name=GestionDeCine

# ---------------------------------------------------------------------------
# Puerto donde escucha el servidor embebido (Tomcat). El front-end (Etapa 2)
# consumira la API mediante http://localhost:8080/... o, si el server se
# mueve a otra maquina, http://<host>:8080/...
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Base de datos: MySQL (motor por defecto del proyecto)
#
# Requiere tener MySQL Server corriendo en localhost:3306.
# - createDatabaseIfNotExist=true -> si la base "gestioncine" no existe, el
#   driver la crea solo (no hace falta correr CREATE DATABASE a mano).
# - allowPublicKeyRetrieval=true  -> necesario en MySQL 8+, cuyo usuario root
#   usa autenticacion caching_sha2_password. Sin esto la conexion falla con
#   "Public Key Retrieval is not allowed".
# - useSSL=false                  -> conexion local sin SSL.
# - serverTimezone                -> evita desfasajes en fechas/horas.
#
# Usuario y password: por defecto root / admin. Si tu MySQL tiene otra
# password, cambiala aca o pasala por variable de entorno sin tocar el archivo:
#   DB_USERNAME=root DB_PASSWORD=tuPassword ./mvnw spring-boot:run
#
# Sin MySQL instalado se puede levantar con H2 (ver application-h2.properties):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gestioncine}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update: Hibernate crea/actualiza las tablas a partir de las @Entity
# cada vez que arranca la aplicacion (no se borran los datos existentes).
# Comodo para el desarrollo de la materia; en un sistema productivo se
# reemplazaria por migraciones versionadas (Flyway/Liquibase).
# El dialecto SQL (MySQL, H2, ...) lo detecta Hibernate solo a partir de la
# conexion, por eso no hace falta configurarlo.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
