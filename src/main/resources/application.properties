spring.application.name=GestionDeCine

# ---------------------------------------------------------------------------
# Todo valor que cambia de una maquina a otra se lee de una variable de
# entorno, con un default para desarrollo local: ${VARIABLE:default}.
# Para mover el servidor a otro equipo solo se cambian variables, nunca codigo.
# Ver application.properties.example para la lista completa.
# ---------------------------------------------------------------------------

# Puerto HTTP del Tomcat embebido.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos MySQL. La base y las tablas NO las crea Spring: se crean
# corriendo database/01_schema.sql (y database/02_datos.sql) en MySQL.
# - allowPublicKeyRetrieval=true: necesario con el usuario root de MySQL 8+.
# - useSSL=false: conexion local sin SSL.
# - serverTimezone: evita desfasajes de fechas/horas entre Java y MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gestioncine}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate: al arrancar, Hibernate compara las @Entity con las tablas
# que ya existen y, si no coinciden, la aplicacion no levanta. Nunca crea ni
# modifica tablas (eso es responsabilidad de los scripts de database/).
# open-in-view=false: la sesion de Hibernate se cierra al terminar el service,
# asi ningun acceso LAZY "se escapa" al controller.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Origenes (URL del front-end) que pueden llamar a la API desde el navegador.
# Varios separados por coma.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500}
