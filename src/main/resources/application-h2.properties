# Perfil "h2": alternativa para levantar la API SIN tener MySQL instalado.
# Activar con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# Usa H2, una base SQL embebida que se guarda en el archivo ./data/gestioncine.mv.db
# (los datos persisten entre reinicios). Todo el resto de la configuracion
# (puerto, ddl-auto, etc.) se toma de application.properties.

spring.datasource.url=jdbc:h2:file:./data/gestioncine;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/gestioncine, user: sa, sin password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
